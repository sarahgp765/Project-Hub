<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sarah's Project Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f1f3d;--navy2:#1a3260;--blue:#1a56db;--bg:#f4f6f9;--surface:#fff;
  --grey1:#374151;--grey2:#6b7280;--grey3:#9ca3af;--grey4:#d1d5db;--grey5:#e5e7eb;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --sh2:0 8px 32px rgba(0,0,0,.12);
  --r:10px;--t:180ms ease;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--grey1);-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.header{
  background:var(--navy);
  padding:1.5rem 2rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.header-brand{display:flex;flex-direction:column;gap:2px}
.header-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.08em;text-transform:uppercase}
.header-sub{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.1em}
.header-badge{
  font-size:10px;font-weight:600;padding:.3rem .75rem;border-radius:20px;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);letter-spacing:.08em;
  border:1px solid rgba(255,255,255,.1);
}

/* ── MAIN LAYOUT ── */
.main{display:flex;height:calc(100vh - 64px)}

/* ── SIDEBAR ── */
.sidebar{
  width:280px;min-width:280px;background:var(--surface);
  border-right:1px solid var(--grey5);
  display:flex;flex-direction:column;overflow-y:auto;
  padding:1.25rem 0;
}
.sb-section{
  font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;
  color:var(--grey3);padding:.75rem 1.5rem .4rem;
}
.nav-btn{
  display:flex;align-items:center;gap:.75rem;
  width:100%;padding:.65rem 1.5rem;
  background:none;border:none;cursor:pointer;text-align:left;
  transition:background var(--t);border-radius:0;
  border-left:3px solid transparent;
}
.nav-btn:hover{background:var(--bg)}
.nav-btn.active{background:#eef2ff;border-left-color:var(--blue)}
.nav-icon{
  width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.nav-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.nav-label{font-size:12.5px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-desc{font-size:10.5px;color:var(--grey2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}

/* ── CONTENT ── */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── WELCOME ── */
.welcome{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;text-align:center;gap:1rem;
}
.welcome-icon{font-size:3rem}
.welcome h1{font-size:22px;font-weight:700;color:var(--navy)}
.welcome p{font-size:14px;color:var(--grey2);max-width:360px;line-height:1.6}
.welcome-cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:1rem;margin-top:.5rem;width:100%;max-width:700px;
}
.wc{
  background:var(--surface);border-radius:var(--r);padding:1.1rem 1rem;
  box-shadow:var(--sh);border:1px solid var(--grey5);cursor:pointer;
  transition:box-shadow var(--t),transform var(--t);text-align:left;
}
.wc:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.wc-icon{font-size:1.5rem;margin-bottom:.5rem}
.wc-name{font-size:12px;font-weight:600;color:var(--navy);line-height:1.3}

/* ── IFRAME WRAPPER ── */
.iframe-wrap{flex:1;display:none;flex-direction:column;overflow:hidden}
.iframe-wrap.visible{display:flex}
.iframe-bar{
  background:var(--surface);border-bottom:1px solid var(--grey5);
  padding:.6rem 1.25rem;display:flex;align-items:center;gap:.75rem;
  flex-shrink:0;
}
.iframe-bar-icon{font-size:1.2rem}
.iframe-bar-title{font-size:13px;font-weight:600;color:var(--navy)}
.iframe-bar-desc{font-size:11px;color:var(--grey2);margin-left:auto;max-width:400px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-iframe{flex:1;border:none;width:100%;height:100%}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .sidebar{width:220px;min-width:220px}
  .nav-desc,.iframe-bar-desc{display:none}
}
@media(max-width:500px){
  .main{flex-direction:column}
  .sidebar{width:100%;min-width:unset;height:auto;flex-direction:row;overflow-x:auto;padding:.5rem 0;border-right:none;border-bottom:1px solid var(--grey5)}
  .sb-section{display:none}
  .nav-btn{flex-direction:column;gap:.25rem;padding:.5rem .75rem;border-left:none;border-bottom:3px solid transparent;min-width:90px}
  .nav-btn.active{border-left-color:transparent;border-bottom-color:var(--blue);background:#eef2ff}
  .nav-icon{width:28px;height:28px;font-size:14px}
  .nav-label{font-size:10px}
}
</style>
</head>

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

let activeId = null;

function openProject(id) {
  activeId = id;
  // update sidebar
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  // hide welcome
  document.getElementById('welcome').style.display = 'none';
  // remove old iframes
  document.querySelectorAll('.iframe-wrap').forEach(el => el.remove());
  // create new iframe
  const p = PROJECTS.find(x => x.id === id);
  const wrap = document.createElement('div');
  wrap.className = 'iframe-wrap visible';
  wrap.innerHTML = `
    <div class="iframe-bar">
      <span class="iframe-bar-icon">${p.icon}</span>
      <span class="iframe-bar-title">${p.label}</span>
      <span class="iframe-bar-desc">${p.desc}</span>
    </div>
    <iframe class="proj-iframe" src="${p.src}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  `;
  document.getElementById('content').appendChild(wrap);
}

// Build sidebar nav
const sidebar = document.getElementById('sidebar');
const section = sidebar.querySelector('.sb-section');
PROJECTS.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn';
  btn.dataset.id = p.id;
  btn.innerHTML = `
    <div class="nav-icon" style="background:${hexToRgba(p.color,.1)}">
      <span>${p.icon}</span>
    </div>
    <div class="nav-text">
      <span class="nav-label">${p.label}</span>
      <span class="nav-desc">${p.desc}</span>
    </div>
  `;
  btn.addEventListener('click', () => openProject(p.id));
  sidebar.appendChild(btn);
});

// Build welcome cards
const wc = document.getElementById('welcome-cards');
PROJECTS.forEach(p => {
  const card = document.createElement('div');
  card.className = 'wc';
  card.innerHTML = `<div class="wc-icon">${p.icon}</div><div class="wc-name">${p.label}</div>`;
  card.addEventListener('click', () => openProject(p.id));
  wc.appendChild(card);
});
</script>
